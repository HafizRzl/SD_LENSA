<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Township Hazard Board</title>
<!-- opened as a file (e.g. from the editor) it can't reach the server: jump to the real address -->
<script>if (location.protocol === 'file:') location.replace('http://localhost:8000/admin.html')</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --teal:#1f8a8a; --dark:#123c40; --orange:#e08a00; --red:#b3261e; --cream:#f4f0e6; --card:#f1ece1; --ink:#1d2b2c; --muted:#6b7273; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, sans-serif; background:var(--cream); color:var(--ink);
         display:grid; grid-template-columns:1fr 460px; height:100vh; }
  #map { height:100%; }
  aside { background:#fff; padding:24px; overflow:auto; box-shadow:-4px 0 16px #0001; }
  .eyebrow { color:var(--teal); font-weight:700; letter-spacing:.12em; font-size:13px; }
  .eyebrow::before { content:''; display:inline-block; width:28px; height:3px; background:var(--teal); vertical-align:middle; margin-right:10px; }
  h1 { margin:10px 0 4px; font-size:26px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .stats { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-bottom:10px; }
  .stat { background:var(--dark); color:#fff; border-radius:12px; padding:10px 4px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:11px; opacity:.85; }
  .stat.late { background:var(--red); }
  .avg { font-size:13px; color:var(--muted); margin:0 0 16px; }
  .item { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer;
          display:grid; grid-template-columns:22px 1fr auto; gap:4px 12px; align-items:center; }
  .item.rejected { opacity:.6; }
  .item .dot { width:14px; height:14px; border-radius:50%; }
  .item h3 { margin:0; font-size:17px; text-transform:capitalize; }
  .item small, .item .due, .item .note, .item .acts, .item .timeline { grid-column:2 / 4; }
  .item small { color:var(--muted); }
  .due { font-size:13px; }
  .due.late { color:var(--red); font-weight:700; }
  .note { font-size:13px; font-style:italic; }
  .chip { color:#fff; font-size:11px; font-weight:700; letter-spacing:.06em; padding:4px 12px; border-radius:999px; text-transform:uppercase; white-space:nowrap; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:4px; }
  .acts:empty { display:none; }
  button { font:inherit; font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--teal); background:var(--teal); color:#fff; cursor:pointer; }
  button.ghost { background:none; color:var(--teal); }
  button.danger { background:var(--red); border-color:var(--red); }
  select { font:inherit; font-size:13px; padding:6px; border-radius:8px; border:1px solid #c9c2b2; background:#fff; max-width:100%; }
  .timeline { font-size:12px; color:var(--muted); margin:6px 0 0; padding-left:18px; }
  .empty { color:var(--muted); }
  dialog { max-width:680px; width:calc(100% - 32px); border:none; border-radius:14px; padding:20px 22px; }
  dialog::backdrop { background:#0007; }
  dialog h2 { margin:0 0 4px; }
  dialog p { margin:0 0 12px; color:var(--muted); font-size:13px; }
  dialog label { font-size:13px; font-weight:600; }
  dialog input, dialog textarea { display:block; width:100%; font:inherit; font-size:14px; padding:8px; border:1px solid #c9c2b2; border-radius:8px; margin:4px 0 10px; }
  dialog textarea { font-family:ui-monospace, Consolas, monospace; font-size:12.5px; }
  dialog .row { display:flex; gap:8px; flex-wrap:wrap; }
  @media (max-width:900px) { body { grid-template-columns:1fr; grid-template-rows:45vh auto; height:auto; } }
</style>
</head>
<body>
<div id="map"></div>
<aside>
  <div class="eyebrow">TOWNSHIP MANAGEMENT</div>
  <h1>Walkway hazards, one map</h1>
  <p class="sub">Logged from everyday walks with LENSA</p>
  <div class="stats">
    <div class="stat"><b id="sNew">0</b><span>1st reports</span></div>
    <div class="stat"><b id="sSend">0</b><span>to send</span></div>
    <div class="stat"><b id="sAgency">0</b><span>with agency</span></div>
    <div class="stat" id="sLateBox"><b id="sLate">0</b><span>overdue</span></div>
    <div class="stat"><b id="sFixed">0</b><span>fixed</span></div>
  </div>
  <p class="avg" id="avg"></p>
  <div id="list"></div>
</aside>

<dialog id="mail">
  <h2 id="mTitle">Email agency</h2>
  <p><span id="mHint"></span> Demo: every email goes to the inbox you type below (remembered).</p>
  <label>To <input id="mTo" type="email" placeholder="your demo inbox"></label>
  <label>Subject <input id="mSubject"></label>
  <label>Message <textarea id="mBody" rows="17"></textarea></label>
  <div class="row">
    <button id="mGmail">Open in Gmail</button>
    <button id="mApp" class="ghost">Open in mail app</button>
    <button id="mCopy" class="ghost">Copy text</button>
    <button id="mClose" class="ghost">Close</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COLORS = { unconfirmed:'#e08a00', confirmed:'#b3261e', sent:'#6b4fbb', in_progress:'#1f8a8a', fixed:'#2e7d32', rejected:'#9e9e9e' }
const LABEL = { unconfirmed:'1st report', confirmed:'confirmed', sent:'with agency', in_progress:'work started', fixed:'fixed', rejected:'rejected' }
const RANK = { confirmed:1, unconfirmed:2, sent:3, in_progress:3, fixed:4, rejected:5 }   // overdue = 0, top of the list

const map = L.map('map').setView([4.3850, 100.9790], 17)
// Esri street basemap, no key. (tile.openstreetmap.org answered 403 "Access blocked"; CARTO now wants a key.)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, maxNativeZoom: 17, attribution: 'Tiles &copy; Esri' }).addTo(map)
const pins = L.layerGroup().addTo(map)
let agencies = {}, fitted = false, lastSnap = ''
const pick = {}          // agency chosen in the dropdown, per case
const expanded = new Set()

const now = () => Date.now() / 1000
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
const enc = encodeURIComponent
const clock = t => new Date(t * 1000).toLocaleString([], { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })
function dur(s) {
  s = Math.abs(s)
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60)
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : m ? `${m} min` : `${Math.round(s)} s`
}
const load = k => { try { return localStorage.getItem(k) || '' } catch { return '' } }
const save = (k, v) => { try { localStorage.setItem(k, v) } catch {} }

async function act(h, action) {
  if (action === 'reject' && !confirm(`Reject case #${h.id} (${h.type}) as a false alarm or duplicate?`)) return
  if (action === 'fixed' && !confirm(`Mark case #${h.id} fixed without the agency's update?`)) return
  try {
    const r = await fetch(`/api/hazards/${h.id}/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agency: pick[h.id] || h.suggested }) })
    const j = await r.json()
    if (!r.ok) throw new Error(j.error)
    if (j.email) showMail(j.email)
  } catch (e) { alert('Could not update the case: ' + e.message) }
  refresh()
}

function showMail(m) {
  mTitle.textContent = (m.subject.startsWith('REMINDER') ? 'Reminder to ' : 'Email to ') + m.agency
  mHint.textContent = m.subject.startsWith('REMINDER')
    ? 'Reminder logged on the case. Send it to chase the agency.'
    : 'Case is now with the agency and the fix-by clock has started. Send this email to make it official.'
  mTo.value = load('demoInbox')
  mSubject.value = m.subject
  mBody.value = m.body
  mail.showModal()
}
mTo.onchange = () => save('demoInbox', mTo.value.trim())
mGmail.onclick = () => window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${enc(mTo.value)}&su=${enc(mSubject.value)}&body=${enc(mBody.value)}`, '_blank')
mApp.onclick = () => { location.href = `mailto:${enc(mTo.value)}?subject=${enc(mSubject.value)}&body=${enc(mBody.value)}` }
mCopy.onclick = async () => {
  try { await navigator.clipboard.writeText(`To: ${mTo.value}\nSubject: ${mSubject.value}\n\n${mBody.value}`); mCopy.textContent = 'Copied ✓' }
  catch { mCopy.textContent = 'Copy failed' }
  setTimeout(() => { mCopy.textContent = 'Copy text' }, 1500)
}
mClose.onclick = () => mail.close()

function card(h, mark) {
  const el = document.createElement('div')
  el.className = 'item ' + h.status
  const c = h.overdue ? COLORS.confirmed : COLORS[h.status]
  let due = ''
  if (h.status === 'sent' || h.status === 'in_progress')
    due = h.overdue
      ? `<div class="due late">OVERDUE by ${dur(now() - h.due_at)} · ${esc(h.agency_name)}${h.reminders ? ` · ${h.reminders} reminder(s) sent` : ''}</div>`
      : `<div class="due">${esc(h.agency_name)} · fix by ${clock(h.due_at)} (in ${dur(h.due_at - now())})</div>`
  if (h.status === 'fixed' && h.fixed_at)
    due = `<div class="due">Fixed ${h.agency_name ? 'by ' + esc(h.agency_name) + ' ' : ''}${dur(h.fixed_at - h.created)} after the first report</div>`
  el.innerHTML = `
    <span class="dot" style="background:${c}"></span>
    <h3>${esc(h.type)}</h3>
    <span class="chip" style="background:${c}">${h.overdue ? 'overdue' : LABEL[h.status]}</span>
    <small>#${h.id} · ${h.urgent ? '<b>URGENT</b> · ' : ''}danger ${h.danger}/10 · ${h.reports} report(s) · ${dur(now() - h.created)} ago</small>
    ${due}
    ${h.note ? `<div class="note">Agency: “${esc(h.note)}”</div>` : ''}
    <div class="acts"></div>
    ${expanded.has(h.id) ? `<ol class="timeline">${h.events.map(e => `<li>${clock(e.t)} · ${esc(e.text)}</li>`).join('') || '<li>No history (logged before timelines existed)</li>'}</ol>` : ''}`

  const acts = el.querySelector('.acts')
  const btn = (label, action, cls = '') => {
    const b = document.createElement('button')
    b.textContent = label; b.className = cls
    b.onclick = e => { e.stopPropagation(); act(h, action) }
    acts.append(b)
  }
  if (h.status === 'unconfirmed') {
    acts.insertAdjacentHTML('beforeend', '<small>Waiting for a 2nd walker, or:</small>')
    btn('Approve now', 'approve'); btn('Reject', 'reject', 'ghost')
  }
  if (h.status === 'confirmed') {
    const sel = document.createElement('select')
    sel.innerHTML = Object.entries(agencies).map(([k, [name, role]]) =>
      `<option value="${k}" ${(pick[h.id] || h.suggested) === k ? 'selected' : ''}>${k} · ${esc(role)}</option>`).join('')
    sel.onclick = e => e.stopPropagation()
    sel.onchange = () => { pick[h.id] = sel.value }
    acts.append(sel)
    btn('Email agency', 'send'); btn('Reject', 'reject', 'ghost')
  }
  if (h.status === 'sent' || h.status === 'in_progress') {
    if (h.overdue) btn('Send reminder', 'remind', 'danger')
    btn('Email again', 'send', 'ghost')
    btn('Mark fixed (admin)', 'fixed', 'ghost')
  }
  el.onclick = () => {
    expanded.has(h.id) ? expanded.delete(h.id) : expanded.add(h.id)
    map.setView([h.lat, h.lon], 18); mark.openPopup()
    lastSnap = ''; refresh()
  }
  return el
}

async function refresh() {
  let hz
  try { hz = await (await fetch('/api/hazards')).json() } catch { return }
  // re-render only on change (so buttons don't vanish mid-click), plus every 30 s so "fix by in…" stays fresh
  const snap = JSON.stringify(hz) + Math.floor(Date.now() / 30000)
  if (snap === lastSnap) return
  lastSnap = snap

  const n = (...s) => hz.filter(h => s.includes(h.status)).length
  sNew.textContent = n('unconfirmed')
  sSend.textContent = n('confirmed')
  sAgency.textContent = n('sent', 'in_progress')
  sLate.textContent = hz.filter(h => h.overdue).length
  sLateBox.classList.toggle('late', hz.some(h => h.overdue))
  sFixed.textContent = n('fixed')
  const fixed = hz.filter(h => h.status === 'fixed' && h.fixed_at)
  avg.textContent = fixed.length
    ? `Average time from first report to fixed: ${dur(fixed.reduce((s, h) => s + h.fixed_at - h.created, 0) / fixed.length)} (${fixed.length} case${fixed.length > 1 ? 's' : ''})`
    : 'No cases fixed yet.'

  pins.clearLayers()
  const marks = {}
  for (const h of hz) {
    marks[h.id] = L.circleMarker([h.lat, h.lon], { radius: h.status === 'rejected' ? 6 : 11, color: '#fff', weight: 2,
        fillColor: h.overdue ? COLORS.confirmed : COLORS[h.status], fillOpacity: .95 })
      .bindPopup(`<b>${esc(h.type)}</b><br>#${h.id} · ${h.overdue ? 'OVERDUE' : LABEL[h.status]} · danger ${h.danger}/10 · ${h.reports} report(s)`).addTo(pins)
  }
  if (!fitted && hz.length) { map.fitBounds(hz.map(h => [h.lat, h.lon]), { maxZoom: 18, padding: [40, 40] }); fitted = true }

  hz.sort((a, b) => (a.overdue ? 0 : RANK[a.status]) - (b.overdue ? 0 : RANK[b.status]) || b.updated - a.updated)
  list.innerHTML = hz.length ? '' : '<p class="empty">No hazards logged yet. They appear here as LENSA users walk.</p>'
  for (const h of hz) list.append(card(h, marks[h.id]))
}

;(async () => {
  try { agencies = await (await fetch('/api/agencies')).json() } catch {}
  refresh()
  setInterval(refresh, 3000)
})()
</script>
</body>
</html>
